<script>
(() => {
  'use strict';
  const W = 576, H = 324;
  const $ = id => document.getElementById(id);
  const stage = $('stage'), cv = $('cv'), main = cv.getContext('2d');
  let g = main;
  const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); };
  let seed = 11;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const glow = (x, y, r, c) => { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, c); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); };
  const offscreen = (w, h, paint) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const prev = g; g = c.getContext('2d'); paint(); g = prev; return c; };
  const clip = (x, y, w, h, fn) => { g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip(); fn(); g.restore(); };
  const vgrad = (x, y, w, h, a, b) => { for (let i = 0; i < h; i++) { const k = i / h; R(x, y + i, w, 1, `rgb(${a[0] + (b[0] - a[0]) * k | 0},${a[1] + (b[1] - a[1]) * k | 0},${a[2] + (b[2] - a[2]) * k | 0})`); } };

  // =====================================================================
  // SPRITES 16x32, the v5 / live lounge drawing (18x34 canvas, 1px outline margin)
  // =====================================================================
  const MODEL = { haiku: ['#5fd39a', '#38946a'], sonnet: ['#5b9cf5', '#3a66b8'], opus: ['#a77bf0', '#6f4cb4'],
                  fable: ['#f2c03a', '#b07f18'], queued: ['#8f8b9c', '#64606f'], tux: ['#24242e', '#15151b'] };
  const MODEL_NAME = { haiku: 'Haiku', sonnet: 'Sonnet', opus: 'Opus', fable: 'Fable', queued: 'no model yet' };
  const SKIN = [['#f6cfa0', '#dca97a'], ['#e6b07a', '#c58c58'], ['#c68642', '#a2692f'], ['#8d5524', '#6c3f19'], ['#ffe0bd', '#e9bf98']];
  const HAIR = [['#24170f', '#140c08'], ['#5a341c', '#3c2010'], ['#d8b25a', '#a88438'], ['#b8b8c0', '#8a8a94'],
                ['#a83a22', '#7a2614'], ['#2e3350', '#1c2036'], ['#e86aa0', '#b84a7a']];
  const cache = new Map();
  function sprite(look, pose) {
    const key = JSON.stringify([look, pose]); let c = cache.get(key); if (c) return c;
    c = document.createElement('canvas'); c.width = 18; c.height = 34; const x = c.getContext('2d');
    const P = (px, py, w, h, col) => { x.fillStyle = col; x.fillRect(px + 1, py + 1, w, h); };
    const CL = (px, py) => x.clearRect(px + 1, py + 1, 1, 1);
    const [m, M] = look.tux ? MODEL.tux : MODEL[look.model];
    const [s, S] = SKIN[look.skin]; const [h, Hh] = HAIR[look.hair];
    const acc = look.tux ? '#efeadf' : (look.accent || '#efe6d6');
    const pants = look.tux ? '#1a1a22' : '#2c2a3a', pantsS = '#1d1b28', shoe = '#140d0a';
    const dress = look.outfit === 'dress' || look.outfit === 'qipao';
    const L = pose.legs || 'stand';
    let lo = 0, ro = 0;
    if (L === 'dance1') lo = -1; if (L === 'dance2') ro = 1;
    if (L === 'sit') {
      if (dress) { P(4, 22, 9, 4, m); P(4, 25, 9, 1, M); P(11, 26, 2, 4, s); P(11, 30, 3, 1, '#6a1020'); }
      else { P(5, 23, 9, 3, pants); P(5, 25, 9, 1, pantsS); P(11, 26, 3, 4, pants); P(11, 30, 4, 1, shoe); }
    } else if (dress) {
      P(6 + lo, 27, 1, 3, s); P(9 + ro, 27, 1, 3, S); P(5 + lo, 30, 3, 1, '#6a1020'); P(8 + ro, 30, 3, 1, '#6a1020');
    } else {
      P(5 + lo, 23, 3, 7, pants); P(7 + lo, 23, 1, 7, pantsS); P(8 + ro, 23, 3, 7, pants); P(10 + ro, 23, 1, 7, pantsS);
      P(4 + lo, 30, 4, 1, shoe); P(8 + ro, 30, 4, 1, shoe);
    }
    P(3, 13, 10, 2, m); P(4, 15, 8, 7, m); P(11, 15, 1, 7, M); P(3, 14, 1, 1, M);
    if (dress) {
      if (L !== 'sit') { P(3, 22, 10, 1, m); P(2, 23, 12, 3, m); P(2, 26, 12, 1, M); P(12, 22, 2, 4, M); }
      if (look.outfit === 'qipao') { P(6, 12, 4, 1, m); P(8, 13, 1, 1, '#f0c050'); P(9, 14, 1, 1, '#f0c050'); P(10, 15, 1, 1, '#f0c050');
        P(10, 16, 1, 1, '#f0c050'); P(5, 18, 1, 1, '#f0c050'); P(6, 19, 1, 1, '#f0c050'); }
      else { P(6, 13, 4, 1, s); P(7, 14, 2, 1, s); }
    } else {
      P(4, 22, 8, 1, look.tux ? '#101016' : '#3a2414'); P(7, 22, 2, 1, '#c89a3c');
      if (look.outfit === 'jacket' || look.tux) { P(7, 13, 2, 5, acc); P(6, 13, 1, 3, M); P(9, 13, 1, 3, M);
        P(7, 13, 2, 1, look.tie || '#c0262a'); P(8, 19, 1, 1, '#d9a441'); P(8, 20, 1, 1, M); }
      else { P(6, 13, 4, 1, acc); P(7, 14, 2, 1, acc); P(8, 16, 1, 1, M); P(8, 18, 1, 1, M); }
      if (look.bow) { P(6, 13, 1, 2, '#c0262a'); P(9, 13, 1, 2, '#c0262a'); P(7, 13, 2, 1, '#8a1a1a'); }
    }
    const la = pose.la || 'down', ra = pose.ra || 'down';
    if (la === 'down') { P(2, 14, 2, 8, m); P(2, 22, 2, 2, s); }
    if (la === 'hip') { P(2, 14, 2, 4, m); P(1, 18, 2, 3, m); P(3, 21, 2, 1, s); }
    if (la === 'cheer') { P(2, 7, 2, 7, m); P(2, 5, 2, 2, s); }
    if (la === 'forward') { P(2, 14, 2, 5, m); P(2, 19, 5, 2, M); P(6, 19, 2, 2, s); }
    if (ra === 'down') { P(12, 14, 2, 8, m); P(13, 14, 1, 8, M); P(12, 22, 2, 2, s); P(13, 22, 1, 2, S); }
    if (ra === 'mouth') { P(12, 14, 2, 4, m); P(13, 14, 1, 4, M); P(10, 12, 2, 6, M); P(9, 10, 2, 2, s); }
    if (ra === 'cheer') { P(12, 7, 2, 7, m); P(13, 7, 1, 7, M); P(12, 5, 2, 2, s); }
    if (ra === 'half') { P(12, 14, 3, 2, m); P(14, 10, 2, 5, M); P(14, 8, 2, 2, s); }
    if (ra === 'forward') { P(12, 14, 2, 5, m); P(13, 14, 1, 5, M); P(9, 19, 5, 2, M); P(8, 19, 2, 2, s); }
    P(4, 3, 8, 9, s); CL(4, 3); CL(11, 3); CL(4, 11); CL(11, 11);
    P(11, 4, 1, 7, S); P(5, 11, 6, 1, S); P(3, 7, 1, 2, s); P(12, 7, 1, 2, S); P(7, 12, 2, 1, S);
    const E = pose.eyes || 'open';
    if (E === 'closed') { P(5, 8, 2, 1, S); P(9, 8, 2, 1, S); }
    else if (E === 'blink') { P(5, 8, 2, 1, '#2a1810'); P(9, 8, 2, 1, '#2a1810'); }
    else { P(5, 7, 2, 2, '#ffffff'); P(9, 7, 2, 2, '#ffffff'); P(6, 7, 1, 2, '#1c120c'); P(10, 7, 1, 2, '#1c120c'); }
    P(5, 6, 2, 1, Hh); P(9, 6, 2, 1, Hh);
    P(5, 9, 1, 1, 'rgba(240,120,110,.45)'); P(10, 9, 1, 1, 'rgba(240,120,110,.45)');
    const mo = pose.mouth || 'neutral';
    if (look.beard) { P(5, 9, 6, 3, h); P(4, 8, 1, 2, h); P(11, 8, 1, 2, Hh); }
    if (mo === 'smile') { P(6, 9, 1, 1, '#8a3a30'); P(7, 10, 2, 1, '#8a3a30'); P(9, 9, 1, 1, '#8a3a30'); }
    else if (mo === 'o') P(7, 10, 2, 1, '#5a1e18');
    else P(7, 10, 2, 1, '#9a4a40');
    if (look.moustache) { P(5, 9, 6, 1, '#5a5a64'); P(4, 10, 1, 1, '#5a5a64'); P(11, 10, 1, 1, '#5a5a64'); }
    if (look.glasses) { P(4, 7, 3, 1, '#20202a'); P(9, 7, 3, 1, '#20202a'); P(7, 7, 2, 1, '#20202a'); }
    if (look.shades) { P(4, 7, 8, 2, '#08080c'); P(5, 7, 1, 1, '#50505e'); P(9, 7, 1, 1, '#50505e'); }
    const hs = look.hs || 'short';
    if (hs === 'hat') { P(2, 4, 12, 1, '#1a1414'); P(4, 1, 8, 3, '#2a2222'); P(4, 3, 8, 1, '#a3221b'); P(5, 1, 6, 1, '#3a3030'); }
    else {
      P(4, 1, 8, 2, h); P(3, 2, 10, 2, h); P(3, 4, 2, 2, h); P(11, 4, 2, 2, h); P(4, 4, 5, 1, h);
      P(9, 1, 3, 2, Hh); P(11, 2, 2, 4, Hh); P(5, 1, 2, 1, 'rgba(255,255,255,.18)');
      if (hs === 'long') { P(2, 4, 2, 11, h); P(12, 4, 2, 11, Hh); P(3, 14, 1, 1, h); }
      if (hs === 'bob') { P(3, 4, 1, 7, h); P(12, 4, 1, 7, Hh); P(4, 4, 8, 1, h); P(3, 11, 2, 1, h); P(11, 11, 2, 1, Hh); }
      if (hs === 'bun') { P(6, 0, 4, 2, h); P(8, 0, 2, 1, Hh); P(7, 1, 2, 1, '#c0262a'); }
      if (hs === 'spiky') { P(4, 0, 1, 1, h); P(6, 0, 1, 1, h); P(8, 0, 1, 1, Hh); P(10, 0, 1, 1, Hh); }
    }
    const img = x.getImageData(0, 0, 18, 34), d = img.data, o = new Uint8ClampedArray(d);
    const op = (a, b) => a >= 0 && b >= 0 && a < 18 && b < 34 && d[(b * 18 + a) * 4 + 3] > 80;
    for (let yy = 0; yy < 34; yy++) for (let xx = 0; xx < 18; xx++) { const i = (yy * 18 + xx) * 4;
      if (d[i + 3] > 80) continue;
      if (op(xx - 1, yy) || op(xx + 1, yy) || op(xx, yy - 1) || op(xx, yy + 1)) { o[i] = 22; o[i + 1] = 12; o[i + 2] = 9; o[i + 3] = 255; } }
    x.putImageData(new ImageData(o, 18, 34), 0, 0);
    const A = pose.acc;
    if (A === 'cigHold') P(14, 22, 2, 1, '#f2ede2');
    if (A === 'cigMouth') P(11, 10, 2, 1, '#f2ede2');
    if (A === 'cigar') { P(9, 10, 3, 1, '#6b3a22'); P(11, 10, 1, 1, '#8a5a3a'); }
    if (A === 'cupHold') { P(14, 20, 2, 3, '#f2ede2'); P(16, 21, 1, 1, '#f2ede2'); P(14, 20, 2, 1, '#6b3a22'); }
    if (A === 'cupMouth') { P(10, 8, 2, 3, '#f2ede2'); P(10, 8, 2, 1, '#6b3a22'); }
    if (A === 'glassHold') { P(14, 20, 2, 3, '#d8902a'); P(14, 20, 2, 1, '#f4d58a'); }
    if (A === 'glassCheer') { P(12, 2, 2, 3, '#d8902a'); P(12, 2, 2, 1, '#f4d58a'); }

      R(330, 140, 104, 56, '#140b08'); R(332, 142, 100, 52, '#24100b'); R(332, 142, 100, 1, '#d9a441'); R(332, 193, 100, 1, '#d9a441');
      // waiting couch and plant

      R(548, 178, 14, 20, '#6b3a22'); for (let i = 0; i < 7; i++) R(546 + i * 2, 154 + (i % 3) * 4, 3, 26, i % 2 ? '#2a6a2a' : '#3a8a3a');
    });
  }
  let butts = 6;
  function drawLobby(t, frame) {

    const blinkOn = (t % .9) < .6;
    // terrace

    liftDoors(114, 62, 30, 42, liftHere(5) ? doorOpen(t) : 0, '#c89a3c');
    R(122, 55, 14, 5, '#140b08'); R(124, 56, 10, 3, '#ffd45c');
    hit({ kind: 'ash', ref: butts, x: 330, y: 76, w: 18, h: 30 });
    butts = 6 + Math.floor(t / 4) % 20;
    const tItems = smokers.map((a, i) => { a.x = TERRACE_SPOTS[i][0]; a.y = TERRACE_SPOTS[i][1]; return { y: a.y, d: () => drawAgent(a, t, frame) }; });
    tItems.push({ y: 105, d: () => ashtray(338, 105, butts) });
    tItems.sort((a, b) => a.y - b.y).forEach(i => i.d());
    // the four floors between, in one line
    PROJECTS.forEach((p, i) => { const th = THEMES[p.theme], x = 200 + i * 86; R(x, 121, 66, 10, '#140b08'); windowBack(th, x + 1, 122, 64, 8, t, i, false);
      if (stuckOn(p) && blinkOn) R(x + 1, 122, 64, 8, 'rgba(255,40,40,.45)'); hit({ kind: 'level', ref: p.level, x, y: 119, w: 66, h: 14 }); });
    // lobby
    LIFT_LANTERNS.forEach(([x, y], i) => lantern(x, y, t, i, 134));
    liftDoors(112, 146, 34, 50, liftHere(0) ? doorOpen(t) : 0, '#c89a3c');
    R(121, 137, 16, 6, '#140b08'); R(123, 138, 12, 4, '#ffd45c');
    PROJECTS.slice().reverse().forEach((p, i) => { const y = 146 + i * 11, th = THEMES[p.theme]; R(336, y, 8, 7, th.trim); R(337, y + 1, 6, 5, th.wall);
      if (stuckOn(p) && blinkOn) R(336, y, 8, 7, '#ff4040'); hit({ kind: 'level', ref: p.level, x: 334, y: y - 2, w: 96, h: 11 }); });
    R(470, 188, 70, 12, '#7a2230'); R(470, 188, 70, 2, '#a8394c'); R(466, 176, 6, 24, '#6a1c28'); R(538, 176, 6, 24, '#6a1c28');
    const items = queued.map((a, i) => ({ y: LOBBY_Q[i][1], d: () => { a.x = LOBBY_Q[i][0]; a.y = LOBBY_Q[i][1]; drawAgent(a, t, frame); } }));
    stuck.forEach((a, i) => { items.push({ y: 314, d: () => { a.x = 300 + i * 22; a.y = 314; drawAgent(a, t, frame); } }); });
    items.push({ y: 284, d: () => drawStaff('maitre', 246, 284, t, frame) }, { y: 304, d: () => drawStaff('doorman', 76, 304, t, frame) },
      { y: 303, d: () => desk(t) }, { y: 306, d: () => rope([8, 30, 52, 74], 304) });
    items.sort((a, b) => a.y - b.y).forEach(i => i.d());
    drawParts(false);
    g.globalCompositeOperation = 'lighter';
    [[220, 44], [470, 46], ...LIFT_LANTERNS].forEach(([x, y], i) => glow(x + 5, y + 9, 56, `rgba(255,186,90,${.26 + Math.sin(t * 6 + i) * .02})`));
    glow(42, 176, 46, 'rgba(255,60,150,.22)'); glow(129, 170, 30, 'rgba(255,200,110,.16)'); glow(540, 22, 26, 'rgba(160,180,255,.14)');
    glow(246, 266, 38, 'rgba(255,200,110,.18)'); glow(382, 168, 40, 'rgba(255,186,90,.1)'); glow(561, 228, 34, 'rgba(255,220,150,.22)');
    if (blinkOn) stuck.forEach(a => glow(a.x, a.y - 30, 20, 'rgba(255,40,40,.38)'));
    g.globalCompositeOperation = 'source-over';
    vignette();
    smokers.forEach(a => nameTag(a, a.x, a.y - 33 - (a.y > 106 ? 8 : 0), `${a.id} · ${a.project.id}`));
    stuck.forEach(a => nameTag(a, a.x, a.y - 44, `${a.id} · ${a.project.id} · needs you`));
    PROJECTS.forEach((p, i) => tag('mini' + i, 233 + i * 86, 120, `${p.level} · ${p.id}`, 'c'));
    PROJECTS.slice().reverse().forEach((p, i) => tag('dir' + i, 348, 146 + i * 11 + 4, `${p.level} ${p.id}${stuckOn(p) ? ' !' : ''}`, 'l' + (stuckOn(p) ? ' alert' : '')));
    tag('dirh', 382, 138, 'floors', 'c gold');
tag('lb', 129, 127, 'L · lobby', 'c gold');
    tag('maitre', 246, 249, 'maître', 'gold'); tag('q', 40, 262, `queue · ${queued.length}`, 'dim');
    neonAt('neon', 42, 176); neonAt('neon2', 129, 43);
  }
  const LIFT_LANTERNS = [[168, 144], [312, 146], [446, 144]];
  function desk(t) { R(204, 268, 84, 4, '#9a5f38'); R(206, 272, 80, 30, '#6b3a22'); R(206, 272, 80, 1, '#d9a441');
    for (let x = 210; x < 282; x += 18) { R(x, 276, 14, 22, '#5a3020'); R(x + 6, 285, 2, 2, '#d9a441'); }
    const ring = ringing(t), bx = 270 + (ring ? (Math.floor(t * 30) % 2 ? -1 : 0) : 0);
    R(bx, 263, 8, 5, '#e8b84a'); R(bx + 2, 262, 4, 1, '#e8b84a'); R(bx + 3, 261, 2, 1, '#fff3c0'); R(bx - 1, 267, 10, 1, '#8a6a20');
    if (ring) { R(bx - 4, 259, 1, 3, '#fff3c0'); R(bx + 11, 259, 1, 3, '#fff3c0'); R(bx - 3, 256, 1, 1, '#fff3c0'); R(bx + 10, 256, 1, 1, '#fff3c0'); }
    R(214, 262, 10, 6, '#3a3a44'); R(215, 263, 8, 3, '#5fd39a'); }

  // =====================================================================
  // STATE: view, elevator, focus floor, alert
  // =====================================================================
  let view = 'facade', curFloor = 1, focus = 1, showNames = true, soundOn = true, armed = false;
  let ringUntil = 0, lastDing = -99;
  const ringing = t => ringUntil > t;
  const stuckOn = p => stuck.some(a => a.project === p);
  const lift = { pos: 1, from: 1, to: 1, t0: 0, dur: 0, moving: false, openAt: -9, then: null };
  const liftHere = lv => !lift.moving && Math.round(lift.pos) === lv;
  const doorOpen = t => { const k = (t - lift.openAt) / 1.6; return k < 0 || k > 1 ? 0 : Math.min(1, Math.sin(k * Math.PI) * 1.6); };
  const levelOfView = () => view === 'floor' ? curFloor : view === 'lobby' ? (lift.pos >= 5 ? 5 : 0) : lift.pos;
  function callLift(lv, after) {
    const t = clock();
    if (view !== 'facade') { lift.pos = levelOfView(); setView('facade'); }
    if (lv >= 1 && lv <= 4) focus = lv;
    lift.from = lift.pos; lift.to = lv; lift.t0 = t; lift.dur = Math.max(.4, Math.abs(lv - lift.pos) * .45); lift.moving = true;
    lift.then = () => { if (lv === 0 || lv === 5) setView('lobby'); else { curFloor = lv; setView('floor'); } lift.openAt = clock(); if (after) after(); };
    paintLiftButtons();
  }
  function stepLift(t) {
    if (!lift.moving) return;
    const k = Math.min(1, (t - lift.t0) / lift.dur), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    lift.pos = lift.from + (lift.to - lift.from) * e;
    if (k >= 1) { lift.moving = false; lift.pos = lift.to; lift.openAt = t; SFX.lift(); const f = lift.then; lift.then = null; paintLiftButtons(); if (f) setTimeout(f, 650); }
  }

  // =====================================================================
  // DOM OVERLAYS: tags, hit boxes, tooltip, panels
  // =====================================================================
  const tagsEl = $('tags'), tagPool = new Map(); let seen = new Set();
  const pct = (v, n) => (v / n * 100) + '%';
  function tag(key, x, y, html, cls = '', always = false) {
    let el = tagPool.get(key); if (!el) { el = document.createElement('div'); tagsEl.appendChild(el); tagPool.set(key, el); }
    if (el._h !== html) { el.innerHTML = html; el._h = html; }
    el.className = 'tag ' + cls; el.style.left = pct(x, W); el.style.top = pct(y, H); el.style.display = ''; el._always = always; seen.add(key);
  }
  function nameTag(a, x, y, text) {
    if (!showNames && hover !== a) return;
    const cls = a.state === 'blocked' ? 'alert' : a.state === 'boss' ? 'gold' : a.parked || a.state === 'queue' ? 'dim' : a.notice ? 'notice' : '';
    tag('a' + a.uid, x, y, text || a.label, cls);
  }
  function neonAt(id, x, y) { const el = $(id); if (x == null) { el.style.display = 'none'; return; } el.style.display = ''; el.style.left = pct(x, W); el.style.top = pct(y, H);
    el.style.opacity = (Math.sin(clock() * 3.1) > .97 || clock() % 7 > 6.85) ? .3 : 1; }
  function flushTags() { for (const [k, el] of tagPool) if (!seen.has(k)) el.style.display = 'none'; seen = new Set(); }
  let hits = [], hover = null;
  const hit = h => hits.push(h);
  const toScene = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; };
  function hitAt(x, y) { for (let i = hits.length - 1; i >= 0; i--) { const h = hits[i]; if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) return h; } return null; }
  function tipFor(h) {
    if (h.kind === 'agent') return `${h.ref.label === 'haiku' ? h.ref.id + ' · haiku' : h.ref.label} · ${h.ref.parked ? 'Parked: its Claude stopped' : STATE[h.ref.state]}`;
    if (h.kind === 'staff') return h.ref.id + (h.ref === STAFF.musician ? ` · music: ${THEMES[projAt(curFloor).theme].music}` : '');
    if (h.kind === 'ash') return `ashtray · ${butts} butts: it fills while rooms wait outside`;
    if (h.kind === 'swatch') return `${THEMES[h.ref].name} · music: ${THEMES[h.ref].music} · put it on floor ${focus}`;
    if (h.kind === 'level' || h.kind === 'call') { const lv = h.ref; if (lv === 0) return 'lobby · take the lift'; if (lv === 5) return 'terrace · take the lift';
      const p = projAt(lv); return `floor ${lv} · ${p.id} · ${THEMES[p.theme].name} · take the lift`; }
    return '';
  }
  const tipEl = $('tip');
  cv.addEventListener('mousemove', e => { const [x, y] = toScene(e), h = hitAt(x, y); cv.style.cursor = h ? 'pointer' : 'default';
    hover = h && h.kind === 'agent' ? h.ref : null;
    if (h) { tipEl.style.display = 'block'; tipEl.textContent = tipFor(h); tipEl.style.left = pct(Math.min(Math.max(x, 70), W - 70), W); tipEl.style.top = pct(y - 6, H); }
    else tipEl.style.display = 'none'; });
  cv.addEventListener('mouseleave', () => { tipEl.style.display = 'none'; hover = null; });
  cv.addEventListener('click', e => { arm(); const [x, y] = toScene(e), h = hitAt(x, y); if (!h) return;
    if (h.kind === 'level' || h.kind === 'call') { SFX.pop(); callLift(h.ref); return; }
    if (h.kind === 'ash') return `ashtray · ${butts} butts: it fills while rooms wait outside`;
    if (h.kind === 'swatch') { setTheme(focus, h.ref); return; }
    if (h.kind === 'staff') { SFX.pop(); popup(x, y - 22, h.ref.quip); return; }
    if (h.kind === 'agent') { SFX.pop(); openPanel(h.ref); } });
  function popup(x, y, text) { stage.querySelectorAll('.pop').forEach(p => p.remove()); const el = document.createElement('div'); el.className = 'pop'; el.textContent = text; el.style.left = pct(Math.min(Math.max(x, 90), W - 90), W); el.style.top = pct(y, H);
    stage.appendChild(el); setTimeout(() => el.remove(), 2100); }
  const panel = $('panel'), help = $('help');
  const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  function openPanel(a) {
    const [mc] = MODEL[a.look.model] || MODEL.queued, blk = a.state === 'blocked';
    const where = a.state === 'smoke' ? 'terrace' : a.state === 'queue' ? 'sidewalk' : blk ? 'lobby, at the bell' : `floor ${a.project.level}`;
    panel.innerHTML = `<button class="x" title="close">×</button><h4>${esc(a.label === 'haiku' ? a.id + ' · subagent' : a.label)}</h4>
      <span class="chip" style="background:${mc}">${MODEL_NAME[a.look.model]}</span><span class="chip" style="background:${blk ? '#ff8b7b' : '#f7e7c6'}">${a.parked ? 'Parked' : STATE[a.state]}</span>
      <div class="lbl">PROJECT</div><div>${esc(a.project.id)} · ${where}</div><div class="lbl">DOING</div><div>${esc(a.task)}</div>
      ${a.last ? `<div class="lbl">LAST MESSAGE</div><div>${esc(a.last)}</div>` : ''}
      ${a.notice ? `<div class="prnote"><b>${esc(a.notice[0])}</b> · ${esc(a.notice[1])}<br><u>Open the PR</u> (mockup)</div>` : ''}
      ${a.parked ? '<div class="lbl">PARKED</div><div>Its Claude stopped with something pending. The panel offers <b>Wake</b>.</div>' : ''}
      ${a.answer ? `<div class="done">You answered: ${esc(a.answer)}. The room rode the lift back to its floor.</div>` : ''}
      ${blk ? `<div class="stuck"><b>Stuck:</b> ${BLOCK.reason}${BLOCK.options.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${'ABC'[i]}</span>${o.t}${o.rec ? '<span class="rec">recommended</span>' : ''}<small style="display:block;opacity:.75;margin-left:1.4em">${o.d}</small></button>`).join('')}</div>` : ''}
`;
    panel.style.display = 'block';
    panel.querySelector('.x').onclick = () => { panel.style.display = 'none'; };
    panel.querySelectorAll('.opt').forEach(b => b.onclick = () => { SFX.send(); backToFloor(a, BLOCK.options[+b.dataset.i].t); openPanel(a); });
  }
  // Answering sends the room back to a free seat at its floor's table (reload the page to see it stuck again).
  function backToFloor(a, answer) {
    const i = SPOTS.work.findIndex((_, k) => !a.project.agents.some(b => b.state === 'work' && b.spot === k));
    a.state = 'work'; a.spot = i; [a.x, a.y] = SPOTS.work[i]; a.answer = answer; stuck = stuck.filter(b => b !== a);
  }
  [panel, help].forEach(p => p.addEventListener('click', e => e.stopPropagation()));
  help.innerHTML = `<button class="x" title="close">×</button><h4>Who is who</h4><div class="legend">
    ${[['#5fd39a', 'Haiku'], ['#5b9cf5', 'Sonnet'], ['#a77bf0', 'Opus'], ['#f2c03a', 'Fable'], ['#8f8b9c', 'Queued'], ['#24242e', 'Staff (not agents)']].map(([c, n]) => `<span><span class="sw" style="background:${c}"></span>${n}</span>`).join('')}
    </div><div class="legend">${[['#ffffff', 'Needs you (red !)'], ['#3fbf7a', 'Ready for you to look'], ['#ff9a3c', 'PR notice'], ['#6b5a4a', 'Dimmed: parked']].map(([c, n]) => `<span><span class="sw" style="background:${c}"></span>${n}</span>`).join('')}</div>
    <div class="hintline">The place tells the state. Click a floor or a lift button to ride; click someone to see their room.</div>`;
  help.querySelector('.x').onclick = () => { help.style.display = 'none'; };

  // =====================================================================
  // CONTROLS
  // =====================================================================
  const bSound = $('b-sound'), bNames = $('b-names'), bTheme = $('b-theme'), alertEl = $('alert'), liftEl = $('lift');
  bSound.onclick = () => { arm(); soundOn = !soundOn; bSound.textContent = 'sound: ' + (soundOn ? 'on' : 'off'); bSound.classList.toggle('off', !soundOn); };
  bNames.onclick = () => { showNames = !showNames; bNames.textContent = 'names: ' + (showNames ? 'always' : 'on hover'); };
  $('b-help').onclick = e => { e.stopPropagation(); help.style.display = help.style.display === 'block' ? 'none' : 'block'; };
  document.querySelectorAll('#viewbar button').forEach(b => b.onclick = () => { arm(); if (b.dataset.v === 'floor') curFloor = focus; setView(b.dataset.v); });
  const liftBtns = [5, 4, 3, 2, 1, 0].map(lv => { const b = document.createElement('button'); b.textContent = LEVEL_NAME[lv];
    b.title = lv === 0 ? 'lobby' : lv === 5 ? 'terrace' : `floor ${lv} · ${projAt(lv).id}`; b.onclick = () => { arm(); callLift(lv); }; liftEl.appendChild(b); return [lv, b]; });
  function paintLiftButtons() { const here = lift.moving ? lift.to : levelOfView(); liftBtns.forEach(([lv, b]) => b.classList.toggle('on', Math.round(here) === lv)); }
  bTheme.onclick = () => { arm(); const lv = view === 'floor' ? curFloor : focus, p = projAt(lv); setTheme(lv, THEME_IDS[(THEME_IDS.indexOf(p.theme) + 1) % THEME_IDS.length]); };
  alertEl.onclick = () => { arm(); callLift(0, () => stuck[0] && openPanel(stuck[0])); };
  function setTheme(lv, id) { const p = projAt(lv); p.theme = id; focus = lv; SFX.pop();
    popup(view === 'floor' ? 288 : 298, view === 'floor' ? 120 : LEVELS[lv].y0 + 20, `${p.id} → ${THEMES[id].name}`); syncUi(); }
  function setView(v) { view = v; panel.style.display = 'none'; resetParts(v === 'floor' ? 6 : 140); syncUi(); }
  function syncUi() {
    document.querySelectorAll('#viewbar button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
    const lv = view === 'floor' ? curFloor : focus, p = projAt(lv);
    bTheme.style.display = view === 'floor' ? '' : 'none';
    bTheme.textContent = `floor ${lv} theme: ${THEMES[p.theme].name} ▸`;
    paintLiftButtons();
    const q = new URLSearchParams({ view, floor: lv, theme: p.theme }); history.replaceState(null, '', '?' + q);
  }
  function updateAlert(t) {
    const s = stuck[0]; if (!s) { alertEl.style.display = 'none'; return; }
    alertEl.style.display = 'block';
    const html = `<b>!</b>${s.id} · ${s.project.id} needs you · at the lobby bell`; if (alertEl._h !== html) { alertEl.innerHTML = html; alertEl._h = html; }
    alertEl.classList.toggle('blink', (t % .9) >= .6);
  }

  // =====================================================================
  // SOUND (WebAudio, no files)
  // =====================================================================
  let ac = null;
  function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); return ac; }
  function tone(f, dur, type, vol, when) { if (!soundOn || !armed) return; const a = audio(); if (!a) return; const t0 = a.currentTime + (when || 0);
    const o = a.createOscillator(), gn = a.createGain(); o.type = type || 'square'; o.frequency.setValueAtTime(f, t0);
    gn.gain.setValueAtTime(vol || .05, t0); gn.gain.exponentialRampToValueAtTime(.0001, t0 + dur); o.connect(gn).connect(a.destination); o.start(t0); o.stop(t0 + dur + .02); }
  const SFX = { ding() { [0, .34].forEach(w => { tone(1568, 1.1, 'sine', .11, w); tone(3136, .5, 'sine', .03, w); }); },
    lift() { tone(1319, .5, 'sine', .07); tone(1047, .7, 'sine', .07, .18); }, pop() { tone(880, .06, 'square', .03); },
    send() { [523, 659, 988].forEach((f, i) => tone(f, .11, 'square', .04, i * .08)); } };
  function arm() { if (armed) return; armed = true; audio(); }

  // =====================================================================
  // LOOP: about 30 fps, paused while the tab is hidden
  // =====================================================================
  let frame = 0, last = 0, raf = 0, paused = 0, hiddenAt = 0;
  const clock = () => (performance.now() - paused) / 1000;
  function tick(now) {
    raf = requestAnimationFrame(tick);
    if (now - last < 32) return; last = now; frame++;
    const t = clock();
    stepLift(t); stepParts();
    if (stuck.length && t - lastDing > 22) { lastDing = t; ringUntil = t + 1; SFX.ding(); }
    hits = []; g = main;
    if (view === 'facade') drawFacade(t, frame); else if (view === 'floor') drawFloor(t, frame); else drawLobby(t, frame);
    flushTags(); updateAlert(t);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { cancelAnimationFrame(raf); raf = 0; hiddenAt = performance.now(); }
    else if (!raf) { paused += performance.now() - hiddenAt; raf = requestAnimationFrame(tick); }
  });
  function fit() { const s = Math.min(innerWidth / W, innerHeight / H), k = s >= 1 ? Math.floor(s) : s; stage.style.setProperty('--s', k); stage.classList.toggle('small', k < 1.5); }
  addEventListener('resize', fit);

  // ?view=facade|floor|lobby&floor=1..4&theme=<id>&themes=<id>,<id>,<id>,<id>&names=0
  const q = new URLSearchParams(location.search);
  const fl = Math.min(4, Math.max(1, +q.get('floor') || 1)); curFloor = focus = fl; lift.pos = q.get('view') === 'lobby' ? 0 : fl;
  (q.get('themes') || '').split(',').forEach((id, i) => { if (THEMES[id] && i < 4) PROJECTS[i].theme = id; });
  if (THEMES[q.get('theme')]) projAt(fl).theme = q.get('theme');
  if (q.get('names') === '0') bNames.click();
  buildFacade(); buildLobby(); fit();
  setView(['facade', 'floor', 'lobby'].includes(q.get('view')) ? q.get('view') : 'facade');
  raf = requestAnimationFrame(tick);
})();
</script>
