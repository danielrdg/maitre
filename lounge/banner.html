<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>maître · banner</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <style>
    body { overflow: visible; display: block; background: #0b0605; }
    .banner { position: relative; width: 1280px; height: 320px; overflow: hidden; }
    .banner canvas { display: block; width: 1280px; height: 320px; }
    .logo, .tagline { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; pointer-events: none; }
    .logo { top: 26px; font: 700 128px/1 var(--font-pixel); color: var(--neon-text);
            text-shadow: 0 0 4px var(--neon), 0 0 14px var(--neon), 0 0 34px #ff2d8a, 0 0 60px rgba(255, 45, 138, .6); }
    .logo .circ { --circ-glow: drop-shadow(0 0 4px var(--neon)) drop-shadow(0 0 16px #ff2d8a); }
    .tagline { top: 182px; font: 400 32px/1 var(--font-tag); color: #ffd45c; letter-spacing: 2px;
               text-shadow: 4px 4px 0 #3a0d0a, -2px 0 0 #140b08, 2px 0 0 #140b08, 0 -2px 0 #140b08, 0 2px 0 #140b08; }
  </style>
</head>
<body>
  <div class="banner" id="banner">
    <canvas id="art" width="1280" height="320"></canvas>
    <div class="logo" role="img" aria-label="maître">ma<span class="circ">ı</span>tre</div>
    <div class="tagline">Your agents' lounge.</div>
  </div>

  <script type="module">
    import { buildSprite } from './js/sprites.js';
    import { drawLantern } from './js/scene.js';
    import { DEMO_CAST, NPCS } from './js/demo.js';
    import { mascotGrid } from './js/icon.js';
    import { mulberry32 } from './js/rng.js';

    // Painted at 320x80 and scaled 4x with no smoothing, then lit at full size.
    const LW = 320, LH = 80, S = 4;
    const low = document.createElement('canvas'); low.width = LW; low.height = LH;
    const g = low.getContext('2d');
    const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); };
    const rnd = mulberry32(7);

    // lacquered lattice wall, wainscot, floor
    R(0, 0, LW, LH, '#3a130f');
    for (let y = 0; y < 60; y += 16) for (let x = 0; x < LW; x += 16) {
      R(x, y, 16, 1, '#4a1a12'); R(x, y, 1, 16, '#4a1a12');
      R(x + 7, y + 4, 2, 8, '#541d14'); R(x + 4, y + 7, 8, 2, '#541d14'); R(x + 7, y + 7, 2, 2, '#6e2c18'); R(x + 5, y + 5, 1, 1, '#4f1b13');
    }
    R(0, 60, LW, 13, '#24100b');
    for (let x = 4; x < LW; x += 22) { R(x, 63, 17, 8, '#2c140d'); R(x, 63, 17, 1, '#3a1c12'); R(x, 70, 17, 1, '#1a0b07'); }
    R(0, 59, LW, 2, '#c89a3c'); R(0, 72, LW, 1, '#c89a3c');
    for (let y = 73; y < LH; y += 4) { R(0, y, LW, 4, (y >> 2) % 2 ? '#3a2216' : '#34200f'); for (let x = (y * 7) % 37; x < LW; x += 37) R(x, y, 1, 4, '#26150c'); }

    const look = kind => NPCS.find(n => n.kind === kind).look;
    const castLook = state => DEMO_CAST.find(e => e[1] === state)[2];
    const pose = p => ({ la: 'down', ra: 'down', legs: 'stand', eyes: 'open', mouth: 'neutral', acc: null, ...p });
    const FEET = 77;
    const figure = (lk, ps, cx) => {
      const x0 = Math.round(cx - 9), y0 = FEET - 31;
      R(cx - 6, FEET, 12, 1, 'rgba(0,0,0,.35)');
      g.drawImage(buildSprite(lk, pose(ps)), x0, y0);
      return [x0, y0];
    };

    // left: lantern, the musician, the dealer at a sliver of card table
    drawLantern(g, 8, 6);
    const sax = figure(look('sax'), { acc: 'sax', ra: 'forward', la: 'forward', eyes: 'closed' }, 38);
    const NOTE = ['.##', '.#.', '.#.', '##.', '##.'];
    [[sax[0] + 15, sax[1] + 4, 1], [sax[0] + 21, sax[1] - 6, 0.7], [sax[0] + 15, sax[1] - 16, 0.4]].forEach(([nx, ny, a]) => {
      g.globalAlpha = a; NOTE.forEach((row, ry) => [...row].forEach((ch, rx) => { if (ch === '#') R(nx + rx, ny + ry, 1, 1, '#ffd45c'); }));
    });
    g.globalAlpha = 1;
    figure(look('dealer'), { la: 'forward', ra: 'half' }, 70);
    R(56, 64, 30, 2, '#9a5f38'); R(57, 66, 28, 6, '#1f6b45'); R(57, 66, 28, 1, '#2f8f5e'); R(56, 72, 30, 2, '#5a3320'); R(56, 72, 30, 1, '#d9a441');
    for (const [cx, red] of [[61, true], [66, false], [76, true]]) { R(cx, 67, 3, 4, '#f2ede2'); R(cx + 1, 68, 1, 1, red ? '#c0262a' : '#1a1a1a'); }
    [[81, '#c0262a'], [84, '#ffd45c']].forEach(([cx, col], i) => { for (let k = 0; k < 3 + i; k++) R(cx - 2, 65 - k, 3, 1, k % 2 ? col : '#efe9dc'); });

    // right: the maître's portrait, a smoker with smoke, lantern
    const fx = 232, fy = 12, grid = mascotGrid();
    R(fx + 17, 0, 1, fy, '#5a3320'); R(fx + 15, fy - 2, 5, 2, '#d9a441');
    R(fx, fy, 36, 36, '#d9a441'); R(fx + 1, fy + 1, 34, 34, '#8a6420'); R(fx + 2, fy + 2, 32, 32, '#5a1a12');
    grid.forEach((row, y) => row.forEach((c, x) => { if (c) R(fx + 2 + x * 2, fy + 2 + y * 2, 2, 2, c); }));
    R(fx, fy, 36, 1, '#ffe08a');

    const smoker = figure(castLook('smoke'), { la: 'hip', acc: 'cigHold', mouth: 'o' }, 282);
    const ex = smoker[0] + 17, ey = smoker[1] + 23;
    R(ex, ey, 1, 1, '#ff7a1a');
    for (let i = 0; i < 46; i++) {
      const k = i / 46, sz = 1 + Math.floor(k * 3);
      const x = ex + Math.sin(k * 7 + rnd() * 0.6) * (1 + k * 4) + k * 7, y = ey - 2 - k * 44;
      g.fillStyle = `rgba(228,222,212,${((1 - k) * 0.55 + 0.05).toFixed(3)})`;
      g.fillRect(Math.round(x - sz / 2), Math.round(y), sz, sz);
    }
    drawLantern(g, 301, 6);

    // scale up, then light
    const cv = document.getElementById('art'), c = cv.getContext('2d');
    c.imageSmoothingEnabled = false;
    c.drawImage(low, 0, 0, LW * S, LH * S);
    const glow = (x, y, r, col) => {
      const gr = c.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = gr; c.fillRect(x - r, y - r, r * 2, r * 2);
    };
    c.globalCompositeOperation = 'lighter';
    glow(13.5 * S, 15 * S, 70 * S / 2, 'rgba(255,186,90,.32)');
    glow(306.5 * S, 15 * S, 70 * S / 2, 'rgba(255,186,90,.32)');
    glow(640, 96, 300, 'rgba(255,60,150,.16)');
    glow(ex * S, ey * S, 10 * S, 'rgba(255,140,60,.25)');
    c.globalCompositeOperation = 'source-over';
    const vg = c.createRadialGradient(640, 160, 260, 640, 160, 720); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(10,4,2,.6)');
    c.fillStyle = vg; c.fillRect(0, 0, 1280, 320);

    await Promise.all([document.fonts.load('700 128px "Pixelify Sans"'), document.fonts.load('32px Silkscreen')]);
    await document.fonts.ready;
    document.body.dataset.ready = '1';
  </script>
</body>
</html>
